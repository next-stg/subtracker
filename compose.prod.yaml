services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-subtracker}"
      POSTGRES_USER: "${POSTGRES_USER:-subtracker}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - subtracker_tracked-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-subtracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-subtracker}"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env}"
      CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in .env}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Subtracker}"
      APP_URL: "${APP_URL:?Set APP_URL in .env}"
    networks:
      - subtracker_tracked-net
      - proxy-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-proxy-net}"
      traefik.http.routers.subtracker.rule: "Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)"
      traefik.http.routers.subtracker.entrypoints: "${TRAEFIK_ENTRYPOINT:-web}"
      traefik.http.services.subtracker.loadbalancer.server.port: "3000"

volumes:
  postgres_data:

networks:
  subtracker_tracked-net:
    internal: true
  proxy-net:
    name: "${TRAEFIK_NETWORK:-proxy-net}"
    external: true
